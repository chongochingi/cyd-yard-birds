; BirdNET-Go live yard-bird display for the ESP32-2432S028 "Cheap Yellow Display".
; Mirrors the streaming panel on hub.abkmj.com: recent detections + live SSE.
;
; No SD card required. Species JPEGs are fetched from BirdNET-Go (they are already
; 320x240, the CYD's native panel size) and cached in the internal LittleFS partition
; (~896 KB = roughly 110 species images at ~8 KB each).

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17

board_build.partitions = huge_app.csv

build_flags =
    ; --- TFT_eSPI: ILI9341 variant 2 on HSPI (same working config as the wiki build) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MOSI=13 -DTFT_MISO=12 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1 -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000
    ; --- Backlight: the CYD puts it on GPIO21. TFT_eSPI will not drive it
    ; unless told to, and a dark-but-running panel is the classic symptom. ---
    -DTFT_BACKLIGHT_PIN=21
    ; --- XPT2046 touch is bit-banged on its own pins (25/39/32/33) ---
    ; It is physically on different pins to the display, so it cannot share HSPI.
    -DTOUCH_SCLK=25 -DTOUCH_MISO=39 -DTOUCH_MOSI=32 -DTOUCH_CS_PIN=33 -DTOUCH_IRQ_PIN=36
    ; --- Cache species JPEGs in internal flash, not SD ---
    -DTJPGD_LOAD_FFS
